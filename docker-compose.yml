services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: seats
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d seats"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend/SeatHold.Api
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=seats;Username=app;Password=app"
      HOLD_DURATION_SECONDS: "600"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: